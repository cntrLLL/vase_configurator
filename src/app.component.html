<div class="flex flex-col h-screen w-screen bg-white font-sans overflow-hidden">
  <!-- Header -->
  <header class="flex items-center justify-between p-4 border-b border-slate-200">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Design your vase</h1>
    </div>
    <div class="flex items-center space-x-2">
      <button class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Load</button>
      <button (click)="exportGLB()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Export GLB</button>
      <button class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Save recipe</button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="flex-1 relative flex items-center justify-center">
    <div class="absolute inset-0 bg-grid-slate-100 [mask-image:linear-gradient(to_bottom,white,white,transparent)]"></div>
    <div class="w-full h-full max-w-6xl max-h-[70vh] relative">
      <div class="absolute inset-0 bg-slate-100 rounded-2xl"></div>
      <canvas #gl class="absolute inset-0 w-full h-full rounded-2xl cursor-grab"
        (mousedown)="onMouseDown($event)"
        (mousemove)="onMouseMove($event)"
        (mouseup)="onMouseUp()"
        (mouseleave)="onMouseLeave()"
        (wheel)="onWheel($event)"></canvas>
    </div>
  </main>
  
  <!-- Bottom Dock -->
  <footer class="w-full bg-slate-50 border-t border-slate-200 p-4">
    <div class="max-w-4xl mx-auto">
      <!-- Tabs -->
      <div class="flex items-center border-b border-slate-200 mb-4">
        <div class="flex space-x-4">
          <button (click)="activeTab.set('material')" class="py-2 px-1 text-sm font-semibold" [class.text-blue-600]="activeTab() === 'material'" [class.text-slate-500]="activeTab() !== 'material'">Material</button>
          <button (click)="activeTab.set('glaze')" class="py-2 px-1 text-sm font-semibold" [class.text-blue-600]="activeTab() === 'glaze'" [class.text-slate-500]="activeTab() !== 'glaze'">Glaze</button>
          <button (click)="activeTab.set('shape')" class="py-2 px-1 text-sm font-semibold" [class.text-blue-600]="activeTab() === 'shape'" [class.text-slate-500]="activeTab() !== 'shape'">Shape</button>
          <button (click)="activeTab.set('finish')" class="py-2 px-1 text-sm font-semibold" [class.text-blue-600]="activeTab() === 'finish'" [class.text-slate-500]="activeTab() !== 'finish'">Finish</button>
          <button (click)="activeTab.set('mark')" class="py-2 px-1 text-sm font-semibold" [class.text-blue-600]="activeTab() === 'mark'" [class.text-slate-500]="activeTab() !== 'mark'">Mark</button>
        </div>
        <div class="flex-grow"></div>
        <div class="flex items-center space-x-2">
            <button (click)="resetToDefaults()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Reset</button>
            <button class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Compare A/B</button>
        </div>
      </div>

      <!-- Tab Content -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-x-8 gap-y-4">
        
        @if (activeTab() === 'material') {
          <div class="col-span-full">
            <div class="flex items-center space-x-2 bg-slate-200 p-1 rounded-lg">
              <button (click)="material.set('ceramic')" class="flex-1 py-1 text-sm font-semibold rounded-md transition-colors" [class.bg-white]="material() === 'ceramic'" [class.text-slate-500]="material() !== 'ceramic'">Ceramic</button>
              <button (click)="material.set('glass')" class="flex-1 py-1 text-sm font-semibold rounded-md transition-colors" [class.bg-white]="material() === 'glass'" [class.text-slate-500]="material() !== 'glass'">Glass</button>
              <button (click)="material.set('metal')" class="flex-1 py-1 text-sm font-semibold rounded-md transition-colors" [class.bg-white]="material() === 'metal'" [class.text-slate-500]="material() !== 'metal'">Metal</button>
            </div>
          </div>
        }

        @if (activeTab() === 'glaze') {
          <!-- Glaze Type -->
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Glaze Type</label>
            <div class="flex items-center space-x-1 bg-slate-200 p-1 rounded-lg">
              <button (click)="glazeType.set('solid')" class="px-3 py-1 text-sm font-semibold rounded-md transition-colors" [class.bg-white]="glazeType() === 'solid'" [class.text-slate-500]="glazeType() !== 'solid'">Solid</button>
              <button (click)="glazeType.set('swirl')" class="px-3 py-1 text-sm font-semibold rounded-md transition-colors" [class.bg-white]="glazeType() === 'swirl'" [class.text-slate-500]="glazeType() !== 'swirl'">Swirl</button>
            </div>
          </div>
          <!-- Color 1 -->
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Color 1</label>
            <input type="color" class="w-24 h-8 rounded-md border border-slate-300" [ngModel]="glazeColor1()" (ngModelChange)="glazeColor1.set($event)">
          </div>
          <!-- Color 2 (Conditional) -->
          @if (glazeType() === 'swirl') {
            <div class="flex items-center justify-between">
              <label class="text-sm font-semibold text-slate-700">Color 2</label>
              <input type="color" class="w-24 h-8 rounded-md border border-slate-300" [ngModel]="glazeColor2()" (ngModelChange)="glazeColor2.set($event)">
            </div>
          } @else {
            <div></div>
          }
          <!-- Glaze Controls (Conditional) -->
          @if (glazeType() === 'swirl') {
            <div class="flex items-center justify-between col-span-1">
              <label class="text-sm font-semibold text-slate-700">Detail</label>
              <input type="range" min="1" max="10" step="0.1" class="w-40 accent-blue-600" [ngModel]="glazeDetail()" (ngModelChange)="glazeDetail.set($event)">
            </div>
            <div class="flex items-center justify-between col-span-1">
              <label class="text-sm font-semibold text-slate-700">Complexity</label>
              <input type="range" min="1" max="5" step="0.1" class="w-40 accent-blue-600" [ngModel]="glazeComplexity()" (ngModelChange)="glazeComplexity.set($event)">
            </div>
            <div class="flex items-center justify-between col-span-1">
              <label class="text-sm font-semibold text-slate-700">Seed</label>
              <button (click)="regenerateGlaze()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Re-generate</button>
            </div>
          }
        }
        
        @if (activeTab() === 'shape') {
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Height</label>
            <input type="range" min="50" max="250" class="w-40 accent-blue-600" [ngModel]="height()" (ngModelChange)="height.set($event)">
          </div>
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Top Radius</label>
            <input type="range" min="20" max="100" class="w-40 accent-blue-600" [ngModel]="topRadius()" (ngModelChange)="topRadius.set($event)">
          </div>
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Bottom Radius</label>
            <input type="range" min="10" max="100" class="w-40 accent-blue-600" [ngModel]="bottomRadius()" (ngModelChange)="bottomRadius.set($event)">
          </div>
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Curvature</label>
            <input type="range" min="0" max="1" step="0.01" class="w-40 accent-blue-600" [ngModel]="curvature()" (ngModelChange)="curvature.set($event)">
          </div>
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Rim Profile</label>
             <select class="w-40 rounded-md border-slate-300" [ngModel]="rimProfile()" (ngModelChange)="rimProfile.set($event)">
                <option value="standard">Standard</option>
                <option value="flared">Flared</option>
                <option value="rounded">Rounded</option>
             </select>
          </div>
        }

        @if (activeTab() === 'finish') {
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Roughness</label>
            <input type="range" min="0" max="1" step="0.01" class="w-40 accent-blue-600" [ngModel]="finishRoughness()" (ngModelChange)="finishRoughness.set($event)">
          </div>
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Metalness</label>
            <input type="range" min="0" max="1" step="0.01" class="w-40 accent-blue-600" [ngModel]="finishMetalness()" (ngModelChange)="finishMetalness.set($event)">
          </div>
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Clearcoat</label>
            <input type="range" min="0" max="1" step="0.01" class="w-40 accent-blue-600" [ngModel]="finishClearcoat()" (ngModelChange)="finishClearcoat.set($event)">
          </div>
        }

        @if (activeTab() === 'mark') {
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Underfoot Code</label>
            <input type="text" class="w-40 rounded-md border-slate-300 text-sm" [ngModel]="underfootCode()" (ngModelChange)="underfootCode.set($event)">
          </div>
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Mark Size</label>
            <input type="range" min="0.1" max="1" step="0.01" class="w-40 accent-blue-600" [ngModel]="markSize()" (ngModelChange)="markSize.set($event)">
          </div>
        }
      </div>
    </div>
  </footer>
</div>
